<div class="login-container">
  <!-- Üst Logo -->
  <div class="logo-container">
    <img src="assets/images/oyak-renault-dark.png" alt="Renault Logo" class="login-logo" />
  </div>

<hr>
  <h1 class="login-title">Proje Takip Sistemi</h1>

  <form (ngSubmit)="onLogin()" class="login-form">
    <div class="form-group">
      <label for="username">IPN</label>
      <input 
        id="username"
        type="text" 
        [(ngModel)]="username" 
        name="username" 
        placeholder="at00000" 
        required 
      />
    </div>

    <div class="form-group">
      <label for="password">Şifre</label>
      <input 
        id="password"
        type="password" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="Şifreniz" 
        required 
      />
    </div>

    <button type="submit" class="btn-submit">Giriş Yap</button>
  </form>

  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</div>
