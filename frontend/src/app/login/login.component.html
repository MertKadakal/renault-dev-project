<div class="login-container">
  <!-- Logo Eklendi -->
  <div class="logo-container">
    <img src="assets/images/oyak-renault-dark.png" alt="Renault Logo" class="login-logo" />
  </div>

  <form (ngSubmit)="onLogin()">
    <div>
      <label>IPN:</label>
      <input type="text" [(ngModel)]="username" name="username" placeholder="at00000" required>
    </div>

    <div>
      <label>Şifre:</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Şifreniz" required>
    </div>

    <button type="submit">Giriş Yap</button>
  </form>

  <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
</div>
